name: E2E CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-tests:
    name: Run browser lifecycle tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore API dependencies
        run: dotnet restore Portfolio.Api/Portfolio.Api.csproj

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Portfolio.Admin/package-lock.json
            Portfolio.Public/package-lock.json
            Portfolio.E2ETests/package-lock.json

      - name: Install Admin dependencies
        working-directory: Portfolio.Admin
        run: npm ci

      - name: Install Public dependencies
        working-directory: Portfolio.Public
        run: npm ci

      - name: Install E2E dependencies
        working-directory: Portfolio.E2ETests
        run: npm ci

      - name: Install Chromium
        working-directory: Portfolio.E2ETests
        run: npx playwright install --with-deps chromium

      - name: Type-check E2E tests
        working-directory: Portfolio.E2ETests
        run: npm run typecheck

      - name: Run E2E tests
        working-directory: Portfolio.E2ETests
        run: npm test

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: Portfolio.E2ETests/test-results/
          if-no-files-found: ignore
          retention-days: 7
