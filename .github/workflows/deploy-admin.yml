name: Deploy Admin

on:
  workflow_run:
    workflows:
      - Admin CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-admin-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Admin to Cloudflare Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore Portfolio.Api/Portfolio.Api.csproj

      - name: Build API
        run: dotnet build Portfolio.Api/Portfolio.Api.csproj --no-restore --configuration Release

      - name: Export Admin GraphQL schema
        run: >-
          dotnet run
          --project Portfolio.Api/Portfolio.Api.csproj
          --no-build
          --no-launch-profile
          --configuration Release
          --
          schema export
          --schema-name admin
          --output obj/admin-schema.graphql

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: Portfolio.Admin/.nvmrc
          cache: npm
          cache-dependency-path: Portfolio.Admin/package-lock.json

      - name: Install Admin dependencies
        working-directory: Portfolio.Admin
        run: npm ci

      - name: Generate Admin GraphQL client
        working-directory: Portfolio.Admin
        env:
          ADMIN_GRAPHQL_SCHEMA: ../Portfolio.Api/obj/admin-schema.graphql
        run: npm run codegen

      - name: Build Admin for Cloudflare Pages
        working-directory: Portfolio.Admin
        env:
          NITRO_PRESET: cloudflare_pages
          NUXT_API_ORIGIN: https://gabriel-mioni-portfolio-api-dhdegzd9dcd2cne2.westus3-01.azurewebsites.net
          NUXT_ADMIN_ORIGIN: https://admin.gabrielmioni.com
          NUXT_PUBLIC_STORAGE_BASE: https://pub-d3d5b63d22fd43639d1e37b5b969c84b.r2.dev
        run: npm run build

      - name: Deploy Admin to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: Portfolio.Admin
          command: pages deploy dist --project-name=gabriel-mioni-portfolio-admin --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
