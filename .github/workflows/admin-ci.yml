name: Admin CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build Admin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUXT_API_ORIGIN: https://api.example.invalid
      NUXT_ADMIN_ORIGIN: https://admin.example.invalid
      NUXT_PUBLIC_STORAGE_BASE: https://images.example.invalid

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore API dependencies
        run: dotnet restore Portfolio.Api/Portfolio.Api.csproj

      - name: Build API
        run: dotnet build Portfolio.Api/Portfolio.Api.csproj --no-restore --configuration Release

      - name: Export Admin GraphQL schema
        run: >-
          dotnet run
          --project Portfolio.Api/Portfolio.Api.csproj
          --no-build
          --no-launch-profile
          --configuration Release
          --
          schema export
          --schema-name admin
          --output obj/admin-schema.graphql

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Portfolio.Admin/package-lock.json

      - name: Install Admin dependencies
        working-directory: Portfolio.Admin
        run: npm ci

      - name: Generate Admin GraphQL client
        working-directory: Portfolio.Admin
        env:
          ADMIN_GRAPHQL_SCHEMA: ../Portfolio.Api/obj/admin-schema.graphql
        run: npm run codegen

      - name: Test Admin
        working-directory: Portfolio.Admin
        run: npm test

      - name: Build Admin
        working-directory: Portfolio.Admin
        run: npm run build
