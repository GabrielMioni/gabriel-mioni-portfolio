fragment ProjectImageUploadInstruction on ProjectImageUploadInstruction {
    clientId
    projectImageId
    full {
        contentType
        key
        publicUrl
        uploadUrl
    }
    thumb {
        contentType
        key
        publicUrl
        uploadUrl
    }
}

mutation prepareProjectImageUploads($input: PrepareProjectImageUploadsInput!) {
  prepareProjectImageUploads(input: $input) {
    items {
      ...ProjectImageUploadInstruction
    }
    userErrors {
      ...MutationUserError
    }
  }
}
