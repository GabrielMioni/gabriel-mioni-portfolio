name: API CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration-tests:
    name: Run API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Portfolio.Api.IntegrationTests/Portfolio.Api.IntegrationTests.csproj

      - name: Build integration tests
        run: >-
          dotnet build
          Portfolio.Api.IntegrationTests/Portfolio.Api.IntegrationTests.csproj
          --no-restore
          --configuration Release

      - name: Run integration tests
        run: >-
          dotnet test
          Portfolio.Api.IntegrationTests/Portfolio.Api.IntegrationTests.csproj
          --no-build
          --configuration Release
